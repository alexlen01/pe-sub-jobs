# GitLab CI pipeline for pe-sub-jobs.
#
# Uses GitLab's built-in Container Registry (CI_REGISTRY / CI_REGISTRY_USER /
# CI_REGISTRY_PASSWORD are provided automatically) — no extra CI/CD variables to configure unless
# pushing to a different registry.

stages:
  - build
  - test
  - package

variables:
  MAVEN_IMAGE: "maven:3.9.9-eclipse-temurin-21-alpine"
  MAVEN_CLI_OPTS: "-B -ntp"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

default:
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository

compile:
  stage: build
  image: $MAVEN_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS clean compile

test:
  stage: test
  image: $MAVEN_IMAGE
  variables:
    # ingest.run-on-startup and bb-template-import both default on; tests that boot the full
    # context should not go looking for pe-sub-api or reach out to data/import on the runner.
    INGEST_RUN_ON_STARTUP: "false"
    BB_TEMPLATE_IMPORT_ENABLED: "false"
  script:
    - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml
        - target/failsafe-reports/*.xml
    paths:
      - target/*.jar
    expire_in: 1 day

package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE"
    - docker push "$CI_REGISTRY_IMAGE:latest"
