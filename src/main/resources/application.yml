server:
  port: ${PORT:3003}

spring:
  application:
    name: pe-sub-jobs
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pesub}
    username: ${SPRING_DATASOURCE_USERNAME:pesub}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  threads:
    virtual:
      enabled: true

ingest:
  # Launch the seed jobs on application startup. Disable (e.g. in tests, or when the shared
  # schema is not yet migrated) to skip them without removing the on-demand /jobs endpoints.
  run-on-startup: ${INGEST_RUN_ON_STARTUP:true}
  facility-file: ${FACILITY_INGEST_FILE:data/mock/facilities.csv}
  lp-master-file: ${LP_MASTER_INGEST_FILE:data/mock/lp_master.csv}
  lp-facility-seeds-file: ${LP_FACILITY_SEEDS_FILE:data/mock/lp_facility_seeds.csv}

logging:
  file:
    path: ${LOG_PATH:logs}
